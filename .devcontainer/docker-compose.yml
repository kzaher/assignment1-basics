services:
  cs336-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    volumes:
      - ..:/workspace
      - .uv-cache:/opt/uv-cache
      - .venv:/opt/venv
    working_dir: /workspace
    environment:
      - UV_CACHE_DIR=/opt/uv-cache
      - VIRTUAL_ENV=/opt/venv
    entrypoint:
    command: sleep infinity
    user: vscode
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  .uv-cache:
    driver: local
  venv:
    driver: local
