services:
  cs336-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    privileged: true
    devices:
      - "/dev/sdf:/dev/sdf"
    volumes:
      - ..:/workspace
      - .uv-cache:/opt/uv-cache
      - .venv:/opt/venv
    working_dir: /workspace
    environment:
      - UV_CACHE_DIR=/opt/uv-cache
      - VIRTUAL_ENV=/opt/venv
    env_file:
      - ./.env
    entrypoint:
    command: sleep infinity
    user: vscode
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:2222:2222"
volumes:
  .uv-cache:
    driver: local
  venv:
    driver: local
